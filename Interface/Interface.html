<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --fond:       #08040a;
    --fond-glow:  #2a0608;
    --accent-rgb: 255, 59, 71;
    --cyan:       rgb(var(--accent-rgb));
    --cyan-vif:   #ff9aa3;
    --vert:       #46ff9c;
    --texte:      #e0b3b6;
    --rouge:      #ff5a6e;
    --ligne:      rgba(255, 255, 255, .05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(circle at 50% 42%, var(--fond-glow) 0%, transparent 60%),
      linear-gradient(var(--ligne) 1px, transparent 1px),
      linear-gradient(90deg, var(--ligne) 1px, transparent 1px),
      var(--fond);
    background-size: 100% 100%, 44px 44px, 44px 44px, 100% 100%;
    color: var(--texte); font-family: 'Share Tech Mono', monospace; height: 100vh; overflow: hidden;
  }
  body, .bar, .titre, .horloge-main, .statut, .stat-val, .ville-nom, .ville-h,
  .armure *, .ring, .noyau { transition: background .8s, color .8s, box-shadow .8s,
                             border-color .8s, text-shadow .8s, stroke .8s, fill .8s; }

  /* ===== CONNEXION ===== */
  #login { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 22px;
           background: radial-gradient(circle at 50% 45%, var(--fond-glow), var(--fond)); }
  #login .halo { position: absolute; width: 340px; height: 340px; border-radius: 50%;
                 background: radial-gradient(circle, rgba(var(--accent-rgb), .25), transparent 70%);
                 filter: blur(20px); animation: pulse 3s ease-in-out infinite; }
  #login .titre { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(34px, 7vw, 58px);
                  letter-spacing: 12px; color: var(--cyan-vif); text-shadow: 0 0 24px var(--cyan); z-index: 1; }
  #login .accroche { letter-spacing: 8px; font-size: 13px; opacity: .7; z-index: 1; margin-top: -10px; }
  .form { z-index: 1; display: flex; flex-direction: column; gap: 14px; width: min(86vw, 340px); margin-top: 10px; }
  .form input { background: rgba(var(--accent-rgb), .06); border: 1px solid rgba(var(--accent-rgb), .4);
                color: var(--cyan-vif); font-family: 'Share Tech Mono', monospace; font-size: 15px;
                padding: 13px 16px; letter-spacing: 2px; outline: none; }
  .form input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(var(--accent-rgb), .4); }
  .form input::placeholder { color: rgba(224, 179, 182, .4); }
  .bouton { cursor: pointer; background: rgba(var(--accent-rgb), .12); border: 1px solid var(--cyan);
            color: var(--cyan-vif); font-family: 'Chakra Petch', sans-serif; font-weight: 600;
            font-size: 15px; letter-spacing: 4px; padding: 14px; text-shadow: 0 0 8px var(--cyan); transition: all .2s; }
  .bouton:hover { background: rgba(var(--accent-rgb), .28); box-shadow: 0 0 20px rgba(var(--accent-rgb), .5); }
  .lien { z-index: 1; cursor: pointer; font-size: 13px; letter-spacing: 2px; opacity: .7; text-decoration: underline; }
  .lien:hover { opacity: 1; }
  .erreur { z-index: 1; color: var(--rouge); font-size: 13px; min-height: 16px; }

  /* ===== INTERFACE ===== */
  #app { display: none; flex-direction: column; align-items: center; height: 100vh; padding: 4vh 5vw; gap: 2vh; }
  .cadre { position: fixed; inset: 16px; border: 1px solid rgba(var(--accent-rgb), .2); pointer-events: none; z-index: 1; }
  .cadre span { position: absolute; width: 20px; height: 20px; border: 2px solid var(--cyan); filter: drop-shadow(0 0 5px var(--cyan)); }
  .cadre .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .cadre .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .cadre .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .cadre .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .titre { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: clamp(15px, 2.4vw, 20px);
           letter-spacing: 10px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); text-align: center; }

  .centre-zone { display: flex; flex-direction: column; align-items: center; gap: 3vh; width: 100%; flex: 1; justify-content: center; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; }

  .horloge-main { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(40px, 9vw, 84px);
                  line-height: 1; color: var(--cyan-vif); letter-spacing: 2px; text-shadow: 0 0 24px rgba(var(--accent-rgb), .6); }
  .horloge-main.actif { color: var(--vert); text-shadow: 0 0 24px var(--vert); }
  .date { font-size: 13px; letter-spacing: 5px; text-transform: uppercase; opacity: .6; }

  /* L'ARMURE (buste original) + le réacteur dans la poitrine */
  .figure { position: relative; width: clamp(210px, 33vmin, 360px); aspect-ratio: 400 / 480; }
  .armure { position: absolute; inset: 0; width: 100%; height: 100%;
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .5)); }
  .armure .ln { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linejoin: round; opacity: .85; }
  .armure .ln.fin { stroke-width: 1.3; opacity: .5; }
  .armure .visor { fill: rgba(var(--accent-rgb), .35); stroke: var(--cyan-vif); stroke-width: 2; }
  /* réacteur centré sur la poitrine (cx=200,cy=330 du viewBox 400x480 -> 50% / 68.75%) */
  .reacteur { position: absolute; left: 50%; top: 68.75%; transform: translate(-50%, -50%); width: 27%; aspect-ratio: 1; }
  .ring { position: absolute; inset: 0; margin: auto; border-radius: 50%; }
  .ring.r1 { width: 100%; height: 100%; border: 2px dashed var(--cyan); opacity: .6; animation: tourne 26s linear infinite; }
  .ring.r2 { width: 64%; height: 64%; border: 1px solid var(--cyan-vif); border-right-color: transparent; animation: tourneInv 16s linear infinite; }
  .noyau { position: absolute; inset: 0; margin: auto; width: 40%; height: 40%; border-radius: 50%;
           background: radial-gradient(circle, #fff 0%, var(--cyan-vif) 35%, var(--cyan) 60%, transparent 80%);
           box-shadow: 0 0 36px 8px var(--cyan); animation: pulse 2.6s ease-in-out infinite; }
  body[data-etat="veille"]    .noyau { animation-duration: 3s; }
  body[data-etat="ecoute"]    .noyau { animation-duration: 1.6s; }
  body[data-etat="reflexion"] .noyau { animation-duration: .6s; box-shadow: 0 0 50px 12px var(--cyan-vif); }
  body[data-etat="reflexion"] .ring.r1 { animation-duration: 8s; }
  body[data-etat="reflexion"] .ring.r2 { animation-duration: 4.5s; }

  .statut { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: clamp(16px, 3vh, 26px);
            letter-spacing: 5px; color: var(--cyan-vif); text-shadow: 0 0 14px rgba(var(--accent-rgb), .5); }

  .stats { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .stat { text-align: center; min-width: 104px; border: 1px solid rgba(var(--accent-rgb), .3);
          padding: 10px 16px; background: rgba(var(--accent-rgb), .04); }
  .stat-label { font-size: 11px; letter-spacing: 4px; opacity: .6; }
  .stat-val { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 24px; color: var(--cyan-vif);
              text-shadow: 0 0 10px rgba(var(--accent-rgb), .5); margin-top: 4px; }

  .panneau-d { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 2vh; }
  .monde-titre { font-size: 11px; letter-spacing: 6px; opacity: .5; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .monde-titre::after { content: ''; flex: 1; height: 1px; background: rgba(var(--accent-rgb), .3); }
  .ville { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0;
           border-bottom: 1px solid var(--ligne); transition: all .4s; }
  .ville-nom { letter-spacing: 3px; font-size: 14px; color: var(--cyan); }
  .ville-h { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 18px; color: var(--cyan-vif); }
  .ville.actif .ville-nom, .ville.actif .ville-h { color: var(--vert); text-shadow: 0 0 14px var(--vert); }

  .btn-stop { cursor: pointer; width: 100%; background: rgba(255, 90, 110, .08); border: 1px solid var(--rouge);
              color: var(--rouge); font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 15px;
              letter-spacing: 4px; padding: 14px; clip-path: polygon(0 0, 100% 0, 100% 72%, 96% 100%, 0 100%);
              text-shadow: 0 0 8px var(--rouge); transition: all .2s; }
  .btn-stop:hover { background: rgba(255, 90, 110, .2); box-shadow: 0 0 22px rgba(255, 90, 110, .45); }
  .btn-stop::before { content: '\25A0  '; }

  @keyframes tourne     { to { transform: rotate(360deg); } }
  @keyframes tourneInv  { to { transform: rotate(-360deg); } }
  @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  /* ====== ÉCRAN HORIZONTAL (normal) : panneaux sur les côtés ====== */
  @media (orientation: landscape) {
    #app { justify-content: flex-start; }
    .centre-zone { display: grid; grid-template-columns: 1fr 1.4fr 1fr; align-items: center;
                   gap: 2vw; max-width: 1500px; }
    .panneau-g { grid-column: 1; justify-self: start; }
    .hero      { grid-column: 2; }
    .panneau-d { grid-column: 3; justify-self: end; max-width: 320px; }
    .panneau-g .stats { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) { .ring, .noyau, #login .halo { animation: none; } }
</style>
</head>
<body>
  <!-- ===== ÉCRAN DE CONNEXION ===== -->
  <div id="login">
    <div class="halo"></div>
    <div class="titre">J.A.R.V.I.S</div>
    <div class="accroche" id="accroche">CONNECTEZ-VOUS</div>
    <div class="form">
      <input id="champ-nom" type="text" placeholder="IDENTIFIANT" autocomplete="off">
      <input id="champ-mdp" type="password" placeholder="MOT DE PASSE">
      <button class="bouton" id="btn-action" onclick="validerLogin()">SE CONNECTER</button>
    </div>
    <div class="erreur" id="erreur"></div>
    <div class="lien" id="bascule" onclick="basculer()">Pas de compte ? Créer un compte</div>
  </div>

  <!-- ===== INTERFACE ===== -->
  <div class="cadre"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <div id="app">
    <div class="titre">JARVIS PERSONAL AI</div>

    <div class="centre-zone">
      <div class="panneau-g">
        <div class="stats">
          <div class="stat"><div class="stat-label">CPU</div><div class="stat-val" id="cpuVal">--</div></div>
          <div class="stat"><div class="stat-label">GPU</div><div class="stat-val" id="gpuVal">--</div></div>
        </div>
      </div>

      <div class="hero">
        <div class="horloge-main" id="horloge">--:--:--</div>
        <div class="date" id="date">—</div>
        <div class="figure">
          <svg class="armure" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
            <!-- casque -->
            <path class="ln" d="M200,46 L246,64 L270,112 L256,152 L226,186 L200,200 L174,186 L144,152 L130,112 L154,64 Z"/>
            <line class="ln fin" x1="200" y1="46" x2="200" y2="104"/>
            <polygon class="visor" points="148,110 252,110 242,130 158,130"/>
            <line class="ln fin" x1="156" y1="150" x2="178" y2="172"/>
            <line class="ln fin" x1="244" y1="150" x2="222" y2="172"/>
            <!-- cou -->
            <polygon class="ln" points="182,200 218,200 226,226 174,226"/>
            <!-- épaulières -->
            <polygon class="ln" points="170,230 96,250 78,316 126,326 160,290"/>
            <polygon class="ln" points="230,230 304,250 322,316 274,326 240,290"/>
            <line class="ln fin" x1="110" y1="262" x2="150" y2="278"/>
            <line class="ln fin" x1="290" y1="262" x2="250" y2="278"/>
            <!-- plastron -->
            <polygon class="ln" points="162,232 152,300 170,396 200,420 230,396 248,300 238,232"/>
            <line class="ln fin" x1="200" y1="232" x2="200" y2="286"/>
            <line class="ln fin" x1="166" y1="262" x2="198" y2="278"/>
            <line class="ln fin" x1="234" y1="262" x2="202" y2="278"/>
            <line class="ln fin" x1="176" y1="398" x2="224" y2="398"/>
            <line class="ln fin" x1="186" y1="411" x2="214" y2="411"/>
            <!-- logement du réacteur -->
            <circle class="ln" cx="200" cy="330" r="54"/>
            <circle class="ln fin" cx="200" cy="330" r="42"/>
          </svg>
          <div class="reacteur">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="noyau"></div>
          </div>
        </div>
        <div class="statut" id="statut">● EN VEILLE</div>
      </div>

      <div class="panneau-d">
        <div>
          <div class="monde-titre">FUSEAUX HORAIRES</div>
          <div id="monde"></div>
        </div>
        <button class="btn-stop" onclick="couperParole()">COUPER LA PAROLE</button>
      </div>
    </div>
  </div>

  <div id="journal" style="display:none"></div>

  <script>
  // ============ Connexion ============
  let modeInscription = false;
  function basculer() {
    modeInscription = !modeInscription;
    document.getElementById('accroche').textContent = modeInscription ? 'CRÉER UN COMPTE' : 'CONNECTEZ-VOUS';
    document.getElementById('btn-action').textContent = modeInscription ? 'CRÉER LE COMPTE' : 'SE CONNECTER';
    document.getElementById('bascule').textContent = modeInscription ? 'Déjà un compte ? Se connecter' : 'Pas de compte ? Créer un compte';
    document.getElementById('erreur').textContent = '';
  }
  function erreurLogin(msg) { document.getElementById('erreur').textContent = msg; }
  function validerLogin() {
    const nom = document.getElementById('champ-nom').value.trim();
    const mdp = document.getElementById('champ-mdp').value;
    if (!nom || !mdp) { erreurLogin('Remplis les deux champs.'); return; }
    const api = window.pywebview && window.pywebview.api;
    const action = modeInscription ? (api && api.creer_compte) : (api && api.connexion);
    if (action) {
      action(nom, mdp).then(reponse => {
        if (reponse && reponse.ok) { entrer(); }
        else { erreurLogin(reponse && reponse.message ? reponse.message : 'Échec.'); }
      });
    } else {
      entrer();   // mode démo (HTML ouvert seul, sans Python)
    }
  }
  function entrer() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    if (window.pywebview && window.pywebview.api && window.pywebview.api.demarrer) {
      window.pywebview.api.demarrer();
    }
  }

  // ============ Fonctions appelées par Python (NE PAS renommer) ============
  function ajouterLigne() {}
  function vousDire(t)   { ajouterLigne(); }
  function jarvisDire(t) { ajouterLigne(); }
  function setStatut(texte, couleur) {
    const s = document.getElementById('statut');
    s.textContent = '● ' + texte;
    if (couleur) s.style.color = couleur;
  }
  const ETATS = {
    veille:    { texte: 'EN VEILLE',      couleur: 'var(--cyan)' },
    ecoute:    { texte: 'JE VOUS ÉCOUTE', couleur: 'var(--vert)' },
    reflexion: { texte: 'JE RÉFLÉCHIS',   couleur: 'var(--cyan-vif)' },
  };
  function setEtat(etat) {
    const e = ETATS[etat] || ETATS.veille;
    setStatut(e.texte, e.couleur);
    document.body.dataset.etat = etat;
  }
  const MODES = {
    aucun:    { rgb: '255, 59, 71',   vif: '#ff9aa3', fond: '#2a0608' },
    travail:  { rgb: '255, 159, 67',  vif: '#ffc78f', fond: '#2a1605' },
    jeu:      { rgb: '166, 110, 255', vif: '#cdb2ff', fond: '#180b2e' },
    codage:   { rgb: '55, 201, 232',  vif: '#7fe8ff', fond: '#062033' },
    'cinéma': { rgb: '255, 122, 196', vif: '#ffb0da', fond: '#260a1c' },
  };
  function setMode(mode) {
    const m = MODES[mode] || MODES.aucun;
    const s = document.documentElement.style;
    s.setProperty('--accent-rgb', m.rgb);
    s.setProperty('--cyan-vif', m.vif);
    s.setProperty('--fond-glow', m.fond);
  }
  function setStats(cpu, gpu) {
    document.getElementById('cpuVal').textContent = cpu || '--';
    document.getElementById('gpuVal').textContent = gpu || '--';
  }
  function couperParole() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.stop_parole) {
      window.pywebview.api.stop_parole();
    }
  }

  // ============ Horloge principale (Toulon) + date ============
  const _J = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const _M = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  function majHorloge() {
    const n = new Date(), f = (x) => String(x).padStart(2,'0');
    document.getElementById('horloge').textContent = `${f(n.getHours())}:${f(n.getMinutes())}:${f(n.getSeconds())}`;
    document.getElementById('date').textContent = `${_J[n.getDay()]} ${n.getDate()} ${_M[n.getMonth()]} ${n.getFullYear()}`;
  }
  setInterval(majHorloge, 1000); majHorloge();

  // ============ Fuseaux : Queenstown + Reykjavik ============
  const VILLES = { 'QUEENSTOWN': 'Pacific/Auckland', 'REYKJAVIK': 'Atlantic/Reykjavik' };
  let villeActive = null;
  function majMonde() {
    const c = document.getElementById('monde');
    c.innerHTML = '';
    for (const [ville, tz] of Object.entries(VILLES)) {
      const h = new Date().toLocaleTimeString('fr-FR', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
      const l = document.createElement('div');
      l.className = 'ville' + (ville === villeActive ? ' actif' : '');
      l.innerHTML = `<span class="ville-nom">${ville}</span><span class="ville-h">${h}</span>`;
      c.appendChild(l);
    }
  }
  setInterval(majMonde, 1000); majMonde();
  function afficherHeure(ville) {
    ville = ville.toUpperCase();
    const hm = document.getElementById('horloge');
    if (ville === 'TOULON') {
      hm.classList.add('actif'); setTimeout(() => hm.classList.remove('actif'), 6000);
    } else if (VILLES[ville]) {
      villeActive = ville; setTimeout(() => { villeActive = null; }, 6000);
    }
  }

  // Aperçu des modes au clavier : 1 à 5
  addEventListener('keydown', (e) => {
    const test = { '1':'aucun', '2':'travail', '3':'jeu', '4':'codage', '5':'cinéma' };
    if (test[e.key]) setMode(test[e.key]);
  });

  setEtat('veille');
  </script>
</body>
</html>
