<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — Système de navigation</title>

<!-- Polices "sci-fi" depuis Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  /* ---- Thème : on centralise les couleurs dans des variables CSS ---- */
  :root {
    --fond:    #000008;
    --cyan:    #37c9e8;
    --cyan-vif:#7fe8ff;
    --vert:    #46ff9c;
    --texte:   #9fdfff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fond);
    overflow: hidden;          /* pas de barres de défilement */
    font-family: 'Share Tech Mono', monospace;
    color: var(--texte);
    cursor: crosshair;
  }

  /* Le canvas 3D occupe tout l'écran (Three.js l'ajoute lui-même) */
  canvas { display: block; }

  /* ---- Le HUD : du texte posé PAR-DESSUS la 3D ---- */
  .hud {
    position: fixed;
    inset: 0;                  /* couvre tout l'écran */
    pointer-events: none;      /* laisse passer la souris vers la 3D */
    z-index: 10;
  }

  /* Coin haut-gauche : titre */
  .hud-tl { position: absolute; top: 26px; left: 32px; }
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px; font-weight: 700;
    letter-spacing: 8px; color: var(--cyan-vif);
    text-shadow: 0 0 12px var(--cyan);
  }
  .subtitle {
    font-size: 12px; letter-spacing: 5px; margin-top: 6px;
    color: var(--cyan); opacity: 0.7;
  }

  /* Coin haut-droite : horloge UTC */
  .hud-tr { position: absolute; top: 26px; right: 32px; text-align: right; }
  .clock {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px; letter-spacing: 4px; color: var(--cyan-vif);
    text-shadow: 0 0 10px var(--cyan);
  }
  .utc { font-size: 11px; letter-spacing: 6px; opacity: 0.6; margin-top: 4px; }

  /* Bas-centre : position */
  .hud-bottom {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%); text-align: center;
  }
  .pos-label {
    font-size: 13px; letter-spacing: 4px; color: var(--vert);
    text-shadow: 0 0 10px var(--vert);
  }
  .pos-coords { font-size: 12px; letter-spacing: 3px; opacity: 0.7; margin-top: 5px; }

  /* Bouton "Ma position" : cliquable (pointer-events:auto) malgré le HUD */
  .hud-btn {
    pointer-events: auto;
    cursor: pointer;
    background: rgba(55, 201, 232, 0.08);
    border: 1px solid var(--cyan);
    color: var(--cyan-vif);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 3px;
    padding: 9px 20px; border-radius: 4px;
    text-shadow: 0 0 8px var(--cyan);
    transition: all 0.2s;
  }
  .hud-btn:hover { background: rgba(55, 201, 232, 0.2); box-shadow: 0 0 14px rgba(55,201,232,0.5); }
  .pos-info { margin-top: 14px; }

  /* Petits coins décoratifs pour le cadre HUD */
  .corner {
    position: absolute; width: 26px; height: 26px;
    border: 2px solid var(--cyan); opacity: 0.5;
  }
  .c-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .c-tr { top: 16px; right: 16px; border-left: none;  border-bottom: none; }
  .c-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
  .c-br { bottom: 16px; right: 16px; border-left: none;  border-top: none; }
</style>
</head>
<body>

  <!-- Couche HUD (texte) au-dessus de la 3D -->
  <div class="hud">
    <span class="corner c-tl"></span>
    <span class="corner c-tr"></span>
    <span class="corner c-bl"></span>
    <span class="corner c-br"></span>

    <div class="hud-tl">
      <div class="title">J.A.R.V.I.S</div>
      <div class="subtitle">SYSTÈME DE NAVIGATION</div>
    </div>

    <div class="hud-tr">
      <div class="clock" id="clock">--:--:--</div>
      <div class="utc">UTC</div>
    </div>

    <div class="hud-bottom">
      <button id="btnPosition" class="hud-btn">◉ AFFICHER MA POSITION</button>
      <div id="infoPosition" class="pos-info" style="display: none;">
        <div class="pos-label">◉ VOTRE POSITION</div>
        <div class="pos-coords">LAT 43.1032°&nbsp;&nbsp;LON 5.8746°</div>
      </div>
    </div>
  </div>

  <!-- On charge Three.js depuis un CDN (ton navigateur va le télécharger) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  // ====================================================================
  //  GLOBE TERRESTRE 3D — version commentée pour comprendre chaque étape
  // ====================================================================

  // ---- Réglages que tu peux modifier ----
  const LAT = 43.1032;          // ta latitude  (ici : Toulon)
  const LON = 5.8746;           // ta longitude
  const RAYON = 2;              // rayon de la Terre dans la scène

  // ---- 1) La SCÈNE, la CAMÉRA et le RENDU (le trio de base en 3D) ----
  const scene = new THREE.Scene();

  // Caméra : (angle de vue, ratio écran, distance min, distance max)
  const camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(0, 1.2, 6.2);   // un peu en hauteur pour voir l'orbite

  // Le moteur de rendu, qui dessine la scène dans la page
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000008, 1);
  document.body.appendChild(renderer.domElement);

  // ---- 2) La LUMIÈRE (sans lumière, la Terre serait toute noire) ----
  scene.add(new THREE.AmbientLight(0x223344, 1.3));   // lumière douce d'ambiance
  const soleil = new THREE.DirectionalLight(0xffffff, 1.5);
  soleil.position.set(-4, 2, 4);                      // crée le jour / la nuit
  scene.add(soleil);

  // ---- 3) Le CHAMP D'ÉTOILES (plein de petits points blancs autour) ----
  const etoilesGeo = new THREE.BufferGeometry();
  const nbEtoiles = 4000;
  const posEtoiles = new Float32Array(nbEtoiles * 3);
  for (let i = 0; i < nbEtoiles; i++) {
    const r = 60 + Math.random() * 40;               // loin de la caméra
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    posEtoiles[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    posEtoiles[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    posEtoiles[i*3+2] = r * Math.cos(phi);
  }
  etoilesGeo.setAttribute('position', new THREE.BufferAttribute(posEtoiles, 3));
  const etoiles = new THREE.Points(
    etoilesGeo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, sizeAttenuation: true })
  );
  scene.add(etoiles);

  // ---- 4) La TERRE ----
  // Deux groupes : un pour l'inclinaison de l'axe, un pour la rotation.
  const groupeInclinaison = new THREE.Group();
  groupeInclinaison.rotation.z = 0;                  // l'inclinaison est désormais pilotée à la souris
  scene.add(groupeInclinaison);

  const groupeTerre = new THREE.Group();             // c'est lui qui tournera
  groupeInclinaison.add(groupeTerre);

  // La sphère + sa "peau" (texture). Si la texture ne charge pas,
  // on garde une sphère bleu foncé (pas d'écran vide).

  );
  const terre = new THREE.Mesh(new THREE.SphereGeometry(RAYON, 64, 64), matiereTerre);
  groupeTerre.add(terre);

  // ---- 5) L'ATMOSPHÈRE (le halo lumineux cyan autour du globe) ----
  // Astuce classique : une sphère un peu plus grande, retournée vers l'intérieur,
  // avec un shader qui n'éclaire que les BORDS (effet "fresnel").
  const matiereAtmo = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal;
      void main() {
        float intensite = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
        gl_FragColor = vec4(0.22, 0.65, 1.0, 1.0) * intensite;
      }`,
    blending: THREE.AdditiveBlending,   // les lumières s'additionnent
    side: THREE.BackSide,               // sphère vue de l'intérieur
    transparent: true
  });
  const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(RAYON * 1.16, 64, 64), matiereAtmo);
  scene.add(atmosphere);

  // ---- 6) L'ORBITE (l'anneau fin qui entoure la planète) ----
  const orbite = new THREE.Mesh(
    new THREE.TorusGeometry(RAYON * 1.5, 0.006, 16, 220),
    new THREE.MeshBasicMaterial({ color: 0x37c9e8, transparent: true, opacity: 0.45 })
  );
  orbite.rotation.x = Math.PI / 2 + 0.18;   // presque horizontal, légèrement penché
  scene.add(orbite);

  // ---- 7) Le MARQUEUR de position (la cible verte sur la Terre) ----
  // On convertit latitude/longitude en un point (x, y, z) sur la sphère.
  function latLonVers3D(lat, lon, rayon) {
    const phi   = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;   // ajuste ce +180 si le point est décalé
    return new THREE.Vector3(
      -rayon * Math.sin(phi) * Math.cos(theta),
       rayon * Math.cos(phi),
       rayon * Math.sin(phi) * Math.sin(theta)
    );
  }
  const point = latLonVers3D(LAT, LON, RAYON);

  const marqueur = new THREE.Group();
  marqueur.position.copy(point);
  // on oriente le marqueur pour qu'il soit "à plat" sur la surface
  marqueur.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), point.clone().normalize());

  // un petit point central…
  marqueur.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x46ff9c })
  ));
  // …et un anneau qui va "pulser"
  const anneau = new THREE.Mesh(
    new THREE.RingGeometry(0.05, 0.07, 32),
    new THREE.MeshBasicMaterial({ color: 0x46ff9c, side: THREE.DoubleSide, transparent: true })
  );
  marqueur.add(anneau);
  groupeTerre.add(marqueur);                 // enfant de la Terre → tourne avec elle
  marqueur.visible = false;                  // caché au départ : il n'apparaît que sur demande

  // ---- 7bis) CONTRÔLES SOURIS : tourner et zoomer le globe ----
  let enRotation = false;        // est-on en train de glisser ?
  let sourisX = 0, sourisY = 0;  // dernière position du curseur
  let angleY = -Math.PI / 2;     // rotation gauche/droite (démarre sur l'Europe)
  let angleX = 0.35;             // rotation haut/bas (légère inclinaison de départ)
  let autoTourne = true;         // tourne tout seul tant qu'on n'a pas cliqué
  let distance = 6.2;            // distance de la caméra (pilote le zoom)

  const toile = renderer.domElement;
  toile.style.cursor = 'grab';

  // On appuie : on commence à faire tourner (fonctionne à la souris ET au doigt)
  toile.addEventListener('pointerdown', (e) => {
    enRotation = true;
    autoTourne = false;                   // on prend la main
    sourisX = e.clientX; sourisY = e.clientY;
    toile.style.cursor = 'grabbing';
  });

  // On relâche : on arrête
  window.addEventListener('pointerup', () => {
    enRotation = false;
    toile.style.cursor = 'grab';
  });

  // On bouge : on transforme le déplacement du curseur en rotation
  window.addEventListener('pointermove', (e) => {
    if (!enRotation) return;
    angleY += (e.clientX - sourisX) * 0.005;
    angleX += (e.clientY - sourisY) * 0.005;
    angleX = Math.max(-1.3, Math.min(1.3, angleX));   // empêche de basculer par-dessus les pôles
    sourisX = e.clientX; sourisY = e.clientY;
  });

  // La molette : zoom avant / arrière
  toile.addEventListener('wheel', (e) => {
    e.preventDefault();
    distance += e.deltaY * 0.003;
    distance = Math.max(3.2, Math.min(12, distance));   // limites du zoom
  }, { passive: false });

  // ---- 8) La BOUCLE D'ANIMATION (relancée ~60 fois par seconde) ----
  const horloge = new THREE.Clock();
  function animer() {
    requestAnimationFrame(animer);
    const t = horloge.getElapsedTime();

    if (autoTourne) angleY += 0.0015;                   // tourne tout seul tant qu'on n'a pas cliqué
    groupeTerre.rotation.y = angleY;                    // rotation gauche/droite (souris)
    groupeTerre.rotation.x = angleX;                    // rotation haut/bas (souris)

    camera.position.set(0, distance * 0.2, distance);   // applique le zoom de la molette
    camera.lookAt(0, 0, 0);

    etoiles.rotation.y = t * 0.005;                     // les étoiles dérivent doucement

    // pulsation du marqueur
    const s = 1 + 0.5 * Math.sin(t * 3);
    anneau.scale.set(s, s, s);
    anneau.material.opacity = 0.8 - 0.4 * Math.abs(Math.sin(t * 3));

    renderer.render(scene, camera);
  }
  animer();

  // ---- 9) S'adapter quand on redimensionne la fenêtre ----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---- 10) L'horloge UTC du HUD ----
  function majHorloge() {
    const n = new Date();
    const f = (x) => String(x).padStart(2, '0');
    document.getElementById('clock').textContent =
      `${f(n.getUTCHours())}:${f(n.getUTCMinutes())}:${f(n.getUTCSeconds())}`;
  }
  setInterval(majHorloge, 1000);
  majHorloge();

  // ---- 11) AFFICHAGE DE LA POSITION (bouton manuel + commande de l'assistant) ----
  let positionVisible = false;
  const bouton = document.getElementById('btnPosition');
  const infoPos = document.getElementById('infoPosition');

  // Une seule fonction qui montre (true) ou cache (false) la position
  function definirPosition(v) {
    positionVisible = v;
    marqueur.visible = v;
    infoPos.style.display = v ? 'block' : 'none';
    bouton.textContent = v ? '◉ MASQUER MA POSITION' : '◉ AFFICHER MA POSITION';
  }

  // Le bouton inverse l'état (commande à la main)
  bouton.addEventListener('click', () => definirPosition(!positionVisible));

  // ---- 12) PONT AVEC L'ASSISTANT : on consulte le serveur toutes les 0,4 s ----
  // Quand l'assistant change le "tableau blanc", la page réagit toute seule.
  let dernierEtat = false;
  setInterval(async () => {
    try {
      const reponse = await fetch('/etat');
      const e = await reponse.json();
      if (e.position !== dernierEtat) {     // seulement si le serveur a changé d'avis
        definirPosition(e.position);        // (comme ça le bouton manuel n'est pas écrasé)
        dernierEtat = e.position;
      }
    } catch (err) { /* serveur indisponible : le bouton manuel marche quand même */ }
  }, 400);
  </script>
</body>
